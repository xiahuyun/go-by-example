---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-webapp-hxia-io-v1-book
  failurePolicy: Fail
  name: mbook-v1.kb.io
  rules:
  - apiGroups:
    - webapp.hxia.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - books
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-webapp-hxia-io-v1-book
  failurePolicy: Fail
  name: vbook-v1.kb.io
  rules:
  - apiGroups:
    - webapp.hxia.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - books
  sideEffects: None
